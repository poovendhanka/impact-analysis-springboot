version: "1.0"
services:
  - id: customer-backend
    name: Customer Management Backend Service
    description: Core Spring Boot microservice for customer management
    repository: poovendhanka/impact-analysis-springboot
    owner: team-backend-core
    apis:
      - customer-api
    depends_on:
      - database-service
    downstream_consumers:
      - service: python-risk-service
        repository: poovendhanka/impact-analysis-python
        consumed_apis:
          - "GET /api/customers/{id}"
      - service: dotnet-api-gateway
        repository: poovendhanka/impact-analysis-dotnet
        consumed_apis:
          - "GET /api/customers/{id}"
      - service: react-frontend
        repository: poovendhanka/impact-analysis-react
        consumed_apis:
          - "POST /api/customers"
          - "GET /api/customers"
          - "GET /api/customers/{id}"
      - service: angular-frontend
        repository: poovendhanka/impact-analysis-angular
        consumed_apis:
          - "GET /api/customers/{id} (via dotnet-api-gateway)"
    domain: CustomerDomain
    system: CoreBanking
    lifecycle: production
