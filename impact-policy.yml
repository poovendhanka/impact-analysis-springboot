critical_components:
  - repository: impact-analysis-springboot
    symbols:
      - CustomerController
      - CustomerService
  - repository: impact-analysis-react
    symbols:
      - CustomerForm
  - repository: impact-analysis-dotnet
    symbols:
      - RiskAssessmentController
  - repository: impact-analysis-python
    symbols:
      - evaluate_risk

critical_apis:
  - method: POST
    path: /api/customers
  - method: GET
    path: /api/customers/{id}

severity_policy:
  fail_on_unknown: false
  require_owner_for_high: true
  require_evidence: true
  conservative_severity_on_disagreement: true

gate:
  mode: enforce

  blocking:
    severities:
      - CRITICAL
      - HIGH
    require_confirmed_evidence: true
    require_policy_match_or_confirmed_breaking_change: false
    ai_only_blocking_allowed: false

  warnings:
    severities:
      - MEDIUM

  analysis_errors:
    action: fail_closed

  override:
    enabled: true
    required_permissions:
      - maintain
      - admin
    require_reason: true
