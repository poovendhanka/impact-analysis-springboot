server:
  port: 0

spring:
  application:
    name: impact-analysis-springboot-test

  datasource:
    url: jdbc:h2:mem:customer_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

cors:
  allowed-origins: "http://localhost:5173"
