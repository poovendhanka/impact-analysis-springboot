name: Cross-Repository Impact Analysis

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
    branches:
      - main

# Least privilege: read repository contents, write PR comment
permissions:
  contents: read
  pull-requests: write

# Prevent duplicate/conflicting concurrent runs for the same PR
concurrency:
  group: impact-analysis-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact-analysis:
    name: Cross-Repository Impact & Graph Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      skip_analysis: ${{ steps.check-secret.outputs.skip_analysis }}
      gate_decision: ${{ steps.extract-gate.outputs.gate_decision }}
      gate_mode: ${{ steps.extract-gate.outputs.gate_mode }}
      is_blocked: ${{ steps.extract-gate.outputs.is_blocked }}

    env:
      COMPANION_REPO: poovendhanka/impact-analysis-react
      ENGINE_REPO: poovendhanka/impact-analysis-engine

    steps:
      # Step 1: Validate Cross-Repository Secret Availability
      - name: Validate Cross-Repository Access Secret
        id: check-secret
        env:
          HAS_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN != '' }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$HAS_TOKEN" = "false" ]; then
            if [ "$IS_FORK" = "true" ]; then
              echo "skip_analysis=true" >> "$GITHUB_OUTPUT"
              echo "::warning::CROSS_REPO_READ_TOKEN secret is not available in fork PR. Gracefully skipping cross-repository analysis."
            else
              echo "::error::Required repository secret 'CROSS_REPO_READ_TOKEN' is missing or not configured."
              echo "Please configure 'CROSS_REPO_READ_TOKEN' in repository secrets with Contents:Read and Metadata:Read permissions."
              exit 1
            fi
          else
            echo "skip_analysis=false" >> "$GITHUB_OUTPUT"
          fi

      # Step 2: Checkout the PR branch in primary repository
      - name: Checkout Primary PR Branch (impact-analysis-springboot)
        if: steps.check-secret.outputs.skip_analysis != 'true'
        uses: actions/checkout@v4
        with:
          path: primary-repo
          fetch-depth: 0
          persist-credentials: false

      # Step 3: Checkout companion repository latest main branch
      - name: Checkout Companion Repository (impact-analysis-react:main)
        if: steps.check-secret.outputs.skip_analysis != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.COMPANION_REPO }}
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          ref: main
          path: companion-repo
          fetch-depth: 1
          persist-credentials: false

      # Step 4: Checkout Impact Analysis Engine
      - name: Checkout Impact Analysis Engine
        if: steps.check-secret.outputs.skip_analysis != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          ref: main
          path: engine-repo
          fetch-depth: 1
          persist-credentials: false

      # Step 5: Verify all repositories are accessible
      - name: Verify Repository Access
        if: steps.check-secret.outputs.skip_analysis != 'true'
        run: |
          echo "=== Verifying Local Directory Structure ==="
          test -d primary-repo/.git || { echo "::error::Primary repo missing .git directory"; exit 1; }
          test -d companion-repo/.git || { echo "::error::Companion repo (${COMPANION_REPO}) missing .git directory"; exit 1; }
          test -d engine-repo/.git || { echo "::error::Engine repo (${ENGINE_REPO}) missing .git directory"; exit 1; }
          echo "✓ Primary repository (impact-analysis-springboot) verified at $(pwd)/primary-repo"
          echo "✓ Companion repository (${COMPANION_REPO}) verified at $(pwd)/companion-repo"
          echo "✓ Engine repository (${ENGINE_REPO}) verified at $(pwd)/engine-repo"

      # Step 6: Collect PR metadata, changed files, and git diff
      - name: Collect PR Metadata and Generate Analysis Input
        id: collect-metadata
        if: steps.check-secret.outputs.skip_analysis != 'true'
        env:
          CURRENT_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p analysis-input
          cd primary-repo

          # Fetch target base branch to ensure clean diffing
          git fetch origin "$BASE_REF" --depth=1 || true

          # Extract changed files list
          git diff --name-only "origin/$BASE_REF"...HEAD > ../analysis-input/changed_files.txt
          CHANGED_COUNT=$(grep -c '[^[:space:]]' ../analysis-input/changed_files.txt || echo "0")
          echo "changed_count=$CHANGED_COUNT" >> "$GITHUB_OUTPUT"
          export CHANGED_COUNT

          # Extract full git unified diff
          git diff "origin/$BASE_REF"...HEAD > ../analysis-input/changes.diff

          cd ..

          # Save labels JSON
          echo '${{ toJson(github.event.pull_request.labels) }}' > analysis-input/labels.json

          # Generate structured metadata JSON safely using environment variables
          python3 -c "
          import json, os, datetime

          try:
              count = int(os.environ.get('CHANGED_COUNT', '0'))
          except ValueError:
              count = 0

          try:
              pr_num = int(os.environ.get('PR_NUMBER', '0'))
          except ValueError:
              pr_num = 0

          metadata = {
              'repository': os.environ.get('CURRENT_REPO', ''),
              'companion_repository': os.environ.get('COMPANION_REPO', ''),
              'pr_number': pr_num,
              'pr_title': os.environ.get('PR_TITLE', ''),
              'pr_author': os.environ.get('PR_AUTHOR', ''),
              'source_branch': os.environ.get('HEAD_REF', ''),
              'target_branch': os.environ.get('BASE_REF', ''),
              'head_sha': os.environ.get('HEAD_SHA', ''),
              'base_sha': os.environ.get('BASE_SHA', ''),
              'changed_files_count': count,
              'generated_at': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }

          with open('analysis-input/metadata.json', 'w', encoding='utf-8') as f:
              json.dump(metadata, f, indent=2)

          with open('analysis-input/changed_files.txt', 'r', encoding='utf-8') as f:
              files = [line.strip() for line in f if line.strip()]

          with open('analysis-input/changed_files.json', 'w', encoding='utf-8') as f:
              json.dump(files, f, indent=2)
          "

          echo "Analysis input generation completed with $CHANGED_COUNT changed file(s)."

      # Step 7: Set up Python and Dependencies
      - name: Set up Python
        if: steps.check-secret.outputs.skip_analysis != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Analysis Engine
        if: steps.check-secret.outputs.skip_analysis != 'true'
        run: |
          pip install ./engine-repo

      # Step 7.5: Detect Authorized Override Request (if present)
      - name: Detect Gate Override Request
        id: detect-override
        if: steps.check-secret.outputs.skip_analysis != 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
        run: |
          python3 -c "
          import json, os, re

          pr_body = os.environ.get('PR_BODY') or ''
          pr_author = os.environ.get('PR_AUTHOR') or ''
          sender_login = os.environ.get('SENDER_LOGIN') or ''

          labels = []
          try:
              with open('analysis-input/labels.json', 'r') as f:
                  labels_data = json.load(f)
                  labels = [l.get('name', '').lower() for l in labels_data if isinstance(l, dict)]
          except Exception:
              pass

          override_reason = ''
          match = re.search(r'(?:\[(?:gate-)?override:\s*([^\]]+)\])|(?:Override-Reason:\s*([^\r\n]+))', pr_body, re.IGNORECASE)
          if match:
              override_reason = (match.group(1) or match.group(2) or '').strip()

          override_user = ''
          if 'gate-override' in labels:
              # Maintainer applying label
              override_user = sender_login or pr_author
              if not override_reason:
                  override_reason = f'PR labeled with gate-override by @{override_user}'
          elif override_reason:
              # Requester in PR body is attributed strictly to PR author
              override_user = pr_author

          print(f'Detected override: user={override_user}, reason={override_reason}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'override_user={override_user}\n')
              out.write(f'override_reason={override_reason}\n')
          "

      # Step 8: Execute Cross-Repository Static Analysis Engine
      - name: Run Impact Analysis Engine
        id: run-engine
        if: steps.check-secret.outputs.skip_analysis != 'true'
        env:
          IMPACT_LLM_ENABLED: ${{ secrets.IMPACT_LLM_ENABLED || 'false' }}
          IMPACT_LLM_BASE_URL: ${{ secrets.IMPACT_LLM_BASE_URL || '' }}
          IMPACT_LLM_MODEL: ${{ secrets.IMPACT_LLM_MODEL || '' }}
          IMPACT_LLM_API_KEY: ${{ secrets.IMPACT_LLM_API_KEY || '' }}
          IMPACT_GATE_MODE: ${{ vars.IMPACT_GATE_MODE || 'dry_run' }}
          CROSS_REPO_READ_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          GATE_OVERRIDE_USER: ${{ steps.detect-override.outputs.override_user }}
          GATE_OVERRIDE_REASON: ${{ steps.detect-override.outputs.override_reason }}
        run: |
          python3 -m engine \
            --repos ./primary-repo ./companion-repo \
            --names impact-analysis-springboot impact-analysis-react \
            --output-dir ./impact-graph-output \
            --pr-mode \
            --pr-repo ./primary-repo \
            --pr-name impact-analysis-springboot \
            --diff-file ./analysis-input/changes.diff \
            --base origin/${{ github.base_ref }} \
            --head HEAD \
            --gate-mode "$IMPACT_GATE_MODE" \
            --strict

      # Step 8.5: Extract Gate Decision Output
      - name: Extract Gate Decision Output
        id: extract-gate
        if: steps.check-secret.outputs.skip_analysis != 'true'
        run: |
          python3 -c "
          import json, os

          try:
              with open('impact-graph-output/impact-gate-result.json', 'r') as f:
                  data = json.load(f)
              decision = data.get('decision', 'UNKNOWN')
              mode = data.get('gate_mode', 'dry_run')
              blocking = str(data.get('blocking', False)).lower()
          except Exception as e:
              decision = 'ERROR'
              mode = 'dry_run'
              blocking = 'false'

          print(f'Gate Decision: {decision}, Mode: {mode}, Blocking: {blocking}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'gate_decision={decision}\n')
              out.write(f'gate_mode={mode}\n')
              out.write(f'is_blocked={blocking}\n')
          "

      # Step 9: Upload Unified Dependency Graph Artifacts (retention 7 days)
      - name: Upload Dependency Graph Artifacts
        if: steps.check-secret.outputs.skip_analysis != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: impact-analysis-graph-pr-${{ github.event.pull_request.number }}-run-${{ github.run_number }}
          path: impact-graph-output/
          retention-days: 7
          if-no-files-found: error

      # Step 10: Upload Analysis Input Artifact
      - name: Upload Analysis Input Artifact
        if: steps.check-secret.outputs.skip_analysis != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: impact-analysis-input-pr-${{ github.event.pull_request.number }}-run-${{ github.run_number }}
          path: analysis-input/
          retention-days: 7
          if-no-files-found: error

      # Step 11: Post or update comprehensive impact summary comment on PR
      - name: Publish or Update PR Status Comment
        if: steps.check-secret.outputs.skip_analysis != 'true'
        uses: actions/github-script@v7
        env:
          CHANGED_COUNT: ${{ steps.collect-metadata.outputs.changed_count }}
        with:
          script: |
            const fs = require('fs');
            const commentIdentifier = '<!-- id: cross-repo-impact-analysis -->';
            const prNumber = context.payload.pull_request.number;
            const changedCount = process.env.CHANGED_COUNT || '0';
            const graphArtifactName = `impact-analysis-graph-pr-${prNumber}-run-${context.runNumber}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const companionRepo = process.env.COMPANION_REPO;

            let summaryMarkdown = '';
            try {
              summaryMarkdown = fs.readFileSync('impact-graph-output/impact-analysis.md', 'utf8');
            } catch (e) {
              try {
                summaryMarkdown = fs.readFileSync('impact-graph-output/graph-summary.md', 'utf8');
              } catch (e2) {
                summaryMarkdown = '> Graph summary file could not be read.';
              }
            }

            const commentBody = `${commentIdentifier}
            ### 🔍 Cross-Repository Dependency & Impact Analysis Engine

            | Status | Verification Check | Details |
            | :---: | :--- | :--- |
            | ✅ | **Current PR Repository Checkout** | \`${context.payload.repository.full_name}\` (branch: \`${context.payload.pull_request.head.ref}\`) |
            | ✅ | **Companion Repository Checkout** | \`${companionRepo}\` (branch: \`main\`) |
            | ℹ️ | **Changed Files in PR** | **${changedCount}** file(s) modified |
            | 📊 | **Dependency Graph Artifacts** | [\`${graphArtifactName}\`](${runUrl}) *(Retention: 7 days)* |

            ${summaryMarkdown}

            *Generated by [impact-analysis-engine](https://github.com/poovendhanka/impact-analysis-engine) • Run [#${context.runNumber}](${runUrl}) • ${new Date().toISOString()}*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.find(c => c.body.includes(commentIdentifier));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody,
              });
              console.log(`Updated existing integration comment (ID: ${existingComment.id})`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
              console.log('Created new integration comment on PR #' + prNumber);
            }

  policy-gate:
    name: Impact Analysis / Policy Gate
    needs: impact-analysis
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Evaluate Policy Gate Decision
        run: |
          ANALYSIS_STATUS="${{ needs.impact-analysis.result }}"
          SKIP_ANALYSIS="${{ needs.impact-analysis.outputs.skip_analysis }}"
          GATE_DECISION="${{ needs.impact-analysis.outputs.gate_decision }}"
          GATE_MODE="${{ needs.impact-analysis.outputs.gate_mode }}"
          IS_BLOCKED="${{ needs.impact-analysis.outputs.is_blocked }}"

          echo "================================================================="
          echo "  IMPACT ANALYSIS - POLICY GATE STATUS CHECK                     "
          echo "================================================================="
          echo "Analysis Job Result: $ANALYSIS_STATUS"
          echo "Skip Analysis:       $SKIP_ANALYSIS"
          echo "Gate Mode:           $GATE_MODE"
          echo "Gate Decision:       $GATE_DECISION"
          echo "Is Blocked:          $IS_BLOCKED"

          if [ "$ANALYSIS_STATUS" = "cancelled" ] || [ "$ANALYSIS_STATUS" = "failure" ]; then
            echo "::error::Impact analysis workflow failed or was cancelled. Failing gate check (fail-closed)."
            exit 1
          fi

          if [ "$SKIP_ANALYSIS" = "true" ]; then
            echo "::notice::Cross-repository analysis was skipped (fork PR without secret). Policy gate passed (fail-open)."
            exit 0
          fi

          if [ "$GATE_DECISION" = "BLOCK" ] || [ "$IS_BLOCKED" = "true" ]; then
            echo "::error::Policy Gate FAILED: Decision is BLOCK under enforce mode. Merge protection active."
            exit 1
          elif [ "$GATE_DECISION" = "WOULD_BLOCK" ]; then
            echo "::warning::Policy Gate Notice: Decision is WOULD_BLOCK (dry_run mode active). Merge allowed."
            exit 0
          elif [ "$GATE_DECISION" = "PASS_WITH_WARNING" ]; then
            echo "::notice::Policy Gate Passed with warning (HIGH severity or non-blocking risks detected)."
            exit 0
          elif [ "$GATE_DECISION" = "PASS" ]; then
            echo "✓ Policy Gate Passed successfully."
            exit 0
          elif [ "$GATE_DECISION" = "SKIPPED" ]; then
            echo "Policy Gate was skipped."
            exit 0
          else
            echo "Policy Gate completed with status: $GATE_DECISION"
            exit 0
          fi
